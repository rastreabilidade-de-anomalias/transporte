<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roteirização · rotas de ônibus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#ffffff; --bg2:#f3f6f8; --ink:#18222d; --muted:#5b6977; --line:#dde3e8;
  --acento:#1d3f6e; --ok:#13915b; --erro:#c0392b; --aviso:#a86a00; --sobrep:#18222d;
  --painel:380px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#151b22; --bg2:#1d252e; --ink:#e7ecf1; --muted:#9aa8b6; --line:#2b3540;
         --acento:#6fa0e6; --ok:#38cf8b; --erro:#ff7f70; --aviso:#f0b54a; --sobrep:#ffffff; }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);font-size:15px}
#mapa{position:fixed;top:0;right:0;bottom:0;left:var(--painel)}
#mapa.tocar{cursor:crosshair}
aside{position:fixed;top:0;left:0;bottom:0;width:var(--painel);background:var(--bg);border-right:1px solid var(--line);
  display:flex;flex-direction:column;z-index:1000;padding-top:env(safe-area-inset-top,0px)}
.topo{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.topo h1{font-family:"Barlow Condensed","Barlow",sans-serif;font-size:1.45rem;margin:0;flex:1}
#recolher{display:none}
.rolagem{overflow:auto;flex:1;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px))}
h2{font-size:.95rem;font-weight:700;margin:16px 0 8px}
h2:first-child{margin-top:0}
.acoes{display:flex;flex-wrap:wrap;gap:6px}
button,.botao{font:inherit;font-size:.88rem;padding:7px 11px;border-radius:8px;border:1px solid var(--line);
  background:var(--bg2);color:var(--ink);cursor:pointer;line-height:1.2}
button.forte{background:var(--acento);border-color:var(--acento);color:#fff}
button.perigo{color:var(--erro)}
button:focus-visible,input:focus-visible,select:focus-visible,.rota:focus-visible,.ponto:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
button.mini{padding:3px 8px;font-size:.8rem}
input,select{font:inherit;font-size:.9rem;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
.linha{display:flex;gap:6px;margin-bottom:6px}
.linha input{flex:1}
.vazio{color:var(--muted);font-size:.9rem;line-height:1.45;margin:4px 0 0}
.rota{display:flex;align-items:center;gap:9px;padding:8px 8px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.rota.ativa{border-color:var(--acento);background:var(--bg2)}
.cor{flex:none;width:14px;height:14px;border-radius:4px}
.rota .nome{flex:1;font-weight:600}
.rota .det{color:var(--muted);font-size:.8rem;font-weight:400;display:block}
.olho{background:none;border:none;padding:4px 6px;font-size:1rem;opacity:.85}
.olho.off{opacity:.3}
.status{font-size:.82rem;color:var(--muted);margin:3px 0;display:flex;gap:6px}
.status b{flex:none;width:1em;text-align:center}
.status.ok b{color:var(--ok)} .status.erro b{color:var(--erro)} .status.esp b{color:var(--aviso)}
.status.erro{color:var(--erro)}
.ponto{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ponto .n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 .95rem "Barlow Condensed",sans-serif}
.ponto .n.pass{width:12px;height:12px;margin:0 7px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.ponto .txt{flex:1;font-size:.88rem;line-height:1.25;min-width:0}
.ponto .txt small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ponto .bt{display:flex;gap:2px}
.legenda{font-size:.8rem;color:var(--muted);display:grid;gap:5px;margin-top:6px}
.legenda span{display:flex;align-items:center;gap:8px}
.lg-sob{width:24px;height:10px;border-radius:5px;background:var(--sobrep);opacity:.45}
.lg-tr{width:24px;border-top:3px dashed var(--muted)}
.lg-comp{width:14px;height:14px;border-radius:50%;border:3px solid #f2b705;margin:0 5px}
.aviso-toque{position:fixed;z-index:1001;left:calc(var(--painel) + 12px);top:calc(12px + env(safe-area-inset-top,0px));
  background:var(--acento);color:#fff;padding:8px 12px;border-radius:9px;font-size:.9rem;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;
  box-shadow:0 2px 6px rgba(0,0,0,.35);display:grid;place-items:center}
.pin span{transform:rotate(45deg);color:#fff;font:700 15px "Barlow Condensed",sans-serif}
.pin.comp{box-shadow:0 0 0 4px #f2b705,0 2px 6px rgba(0,0,0,.35)}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pop b{font-size:1rem}
.pop .acoes{margin-top:8px}
.pop small{color:#5b6977}
input[type=file]{display:none}
@media (max-width:760px){
  :root{--painel:0px}
  aside{top:auto;width:100%;height:46vh;border-right:none;border-top:1px solid var(--line);border-radius:14px 14px 0 0;
    box-shadow:0 -6px 20px rgba(0,0,0,.18);padding-top:0}
  aside.fechado{height:auto}
  aside.fechado .rolagem{display:none}
  #mapa{bottom:46vh}
  body.painel-fechado #mapa{bottom:60px}
  #recolher{display:inline-block}
  .aviso-toque{left:12px}
}
</style>
</head>
<body>
<div id="mapa" role="application" aria-label="Mapa das rotas"></div>
<div id="avisoToque" class="aviso-toque" hidden></div>

<aside id="painel">
  <div class="topo">
    <h1>Roteirização</h1>
    <button id="verTodas" class="mini">Ver todas</button>
    <button id="recolher" class="mini" aria-expanded="true">Recolher</button>
  </div>
  <div class="rolagem">
    <div class="acoes">
      <label class="botao" for="arquivo">Carregar planilha</label>
      <input type="file" id="arquivo" accept=".xlsx,.xls,.csv">
      <button id="salvarExcel">Salvar em Excel</button>
      <button id="limparTudo" class="perigo">Limpar tudo</button>
    </div>
    <div id="msgImport" class="vazio" aria-live="polite"></div>

    <h2>Rotas</h2>
    <div id="listaRotas"></div>
    <div class="linha" style="margin-top:8px">
      <input id="novaRota" placeholder="Nome da nova rota, ex.: ROP-02" aria-label="Nome da nova rota">
      <button id="criarRota">Criar</button>
    </div>

    <div id="blocoAtiva"></div>

    <h2>Serviços</h2>
    <div id="stRotas" class="status"><b>·</b><span>Caminho pelas ruas: aguardando pontos</span></div>
    <div id="stNomes" class="status"><b>·</b><span>Nome das ruas: aguardando pontos</span></div>

    <h2>Legenda</h2>
    <div class="legenda">
      <span><i class="lg-sob"></i>Trecho usado por mais de uma rota (toque para ver quais)</span>
      <span><i class="lg-comp"></i>Parada usada por mais de uma rota</span>
      <span><i class="lg-tr"></i>Ligação reta: o caminho pelas ruas não foi calculado</span>
    </div>
  </div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
"use strict";
const CORES = ["#1f6fd1","#e0531f","#13915b","#9b3fc4","#c99700","#d12b6a","#1597a8","#7a5520","#4f6b00","#ff7f0e","#3b3bc4","#b5121b","#2e8b8b","#8a2be2","#6d6d6d"];
const CHAVE = "roteirizacao_v1";

// ---------- estado ----------
let estado = carregarLocal();
let ativa = estado.rotas[0] ? estado.rotas[0].nome : null;
let modoTocar = false;
let tipoNovo = "parada";
const geoms = {}; // nome da rota -> {key, coords, km, viaRuas, carregando}

function carregarLocal(){
  try{ const s = localStorage.getItem(CHAVE); if(s){ const d = JSON.parse(s); if(d && d.rotas && d.pontos) return d; } }catch(e){}
  return {rotas:[], pontos:[]};
}
function salvarLocal(){ try{ localStorage.setItem(CHAVE, JSON.stringify(estado)); }catch(e){} }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rota = nome => estado.rotas.find(r => r.nome === nome);
const pontosDe = nome => estado.pontos.filter(p => p.rota === nome).sort((a,b) => a.ordem - b.ordem);
function renumerar(nome){ pontosDe(nome).forEach((p,i) => p.ordem = i+1); }
function proximaCor(){
  const usadas = new Set(estado.rotas.map(r => r.cor));
  return CORES.find(c => !usadas.has(c)) || CORES[estado.rotas.length % CORES.length];
}
function garantirRota(nome){
  let r = rota(nome);
  if(!r){ r = {nome, cor:proximaCor(), visivel:true}; estado.rotas.push(r); }
  return r;
}
function numeroParada(p){
  if(p.tipo === "passagem") return null;
  return pontosDe(p.rota).filter(x => x.tipo !== "passagem").indexOf(p) + 1;
}

function setStatus(id, tipo, texto){
  const el = document.getElementById(id);
  el.className = "status " + tipo;
  el.querySelector("b").textContent = tipo==="ok" ? "✓" : tipo==="erro" ? "✕" : tipo==="esp" ? "…" : "·";
  el.querySelector("span").textContent = texto;
}

// ---------- mapa ----------
if(typeof L === "undefined"){
  document.body.innerHTML = '<p style="padding:20px;font-family:sans-serif">A biblioteca do mapa não carregou. Confira a internet e abra a página de novo.</p>';
  throw new Error("Leaflet ausente");
}
const mapa = L.map("mapa", {zoomControl:true}).setView([-2.55,-44.2], 12);
const baseRuas = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {maxZoom:19, attribution:"Mapa © Esri"});
const baseSat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {maxZoom:19, attribution:"Imagem © Esri"});
baseRuas.addTo(mapa);
L.control.layers({"Ruas":baseRuas, "Satélite":baseSat}, {}, {position:"topright"}).addTo(mapa);
L.control.scale({imperial:false}).addTo(mapa);

const camadaSobrep = L.layerGroup().addTo(mapa);
const camadaLinhas = L.layerGroup().addTo(mapa);
const camadaPinos = L.layerGroup().addTo(mapa);
const marcadores = {};

mapa.on("click", e => {
  if(!modoTocar || !ativa) return;
  adicionarPonto(ativa, e.latlng.lat, e.latlng.lng, "", tipoNovo);
});

// ---------- distância e geometria ----------
function metros(a, b){
  const k = Math.PI/180, R = 6371000;
  const dLat = (b[0]-a[0])*k, dLng = (b[1]-a[1])*k;
  const s = Math.sin(dLat/2)**2 + Math.cos(a[0]*k)*Math.cos(b[0]*k)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function comprimento(coords){ let t=0; for(let i=1;i<coords.length;i++) t += metros(coords[i-1], coords[i]); return t; }
function amostrar(coords, passo){
  const out = [];
  for(let i=0;i<coords.length-1;i++){
    const a = coords[i], b = coords[i+1], d = metros(a,b), n = Math.max(1, Math.ceil(d/passo));
    for(let j=0;j<n;j++){ const t=j/n; out.push([a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t]); }
  }
  if(coords.length) out.push(coords[coords.length-1]);
  return out;
}
const TAM = 0.00018; // ~20 m
const celula = (lat,lng) => [Math.round(lat/TAM), Math.round(lng/TAM)];

// ---------- caminho pelas ruas (OSRM) ----------
let falhasRota = 0;
async function calcularCaminho(nome){
  const pts = pontosDe(nome);
  if(pts.length < 2){ delete geoms[nome]; return; }
  const key = pts.map(p => p.lat.toFixed(6)+","+p.lng.toFixed(6)).join("|");
  if(geoms[nome] && geoms[nome].key === key) return;
  const reta = pts.map(p => [p.lat,p.lng]);
  geoms[nome] = {key, coords:reta, km:comprimento(reta)/1000, viaRuas:false, carregando:true};
  setStatus("stRotas", "esp", "Caminho pelas ruas: calculando " + nome);
  try{
    const coords = [];
    const LOTE = 25;
    for(let i=0; i<pts.length-1; i += LOTE-1){
      const lote = pts.slice(i, i+LOTE);
      if(lote.length < 2) break;
      const q = lote.map(p => p.lng+","+p.lat).join(";");
      const ctrl = new AbortController(); const tm = setTimeout(() => ctrl.abort(), 20000);
      const r = await fetch("https://router.project-osrm.org/route/v1/driving/"+q+"?overview=full&geometries=geojson", {signal:ctrl.signal});
      clearTimeout(tm);
      if(!r.ok) throw new Error("o serviço respondeu "+r.status);
      const d = await r.json();
      if(d.code !== "Ok" || !d.routes || !d.routes[0]) throw new Error("o serviço não achou caminho");
      const g = d.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
      if(coords.length) g.shift();
      coords.push(...g);
    }
    if(!geoms[nome] || geoms[nome].key !== key) return; // mudou no meio
    geoms[nome] = {key, coords, km:comprimento(coords)/1000, viaRuas:true, carregando:false};
    falhasRota = 0;
    setStatus("stRotas", "ok", "Caminho pelas ruas: funcionando");
  }catch(e){
    if(!geoms[nome] || geoms[nome].key !== key) return;
    geoms[nome].carregando = false;
    falhasRota++;
    const motivo = e.name === "AbortError" ? "demorou demais para responder" : (e.message || "sem conexão");
    setStatus("stRotas", "erro", "Caminho pelas ruas falhou em "+nome+" ("+motivo+"). A rota aparece em linha reta; use “Recalcular caminho” depois.");
  }
  desenhar(); desenharPainel();
}
function calcularTodas(){ estado.rotas.forEach(r => calcularCaminho(r.nome)); }

// ---------- nome das ruas (Nominatim, 1 por segundo) ----------
const filaNomes = [];
let filaRodando = false;
function pedirNome(p){ if(!filaNomes.includes(p.id)) filaNomes.push(p.id); rodarFila(); }
async function rodarFila(){
  if(filaRodando) return; filaRodando = true;
  while(filaNomes.length){
    const id = filaNomes.shift();
    const p = estado.pontos.find(x => x.id === id);
    if(!p) continue;
    setStatus("stNomes", "esp", "Nome das ruas: buscando ("+(filaNomes.length+1)+" na fila)");
    try{
      const r = await fetch("https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=17&accept-language=pt-BR&lat="+p.lat+"&lon="+p.lng);
      if(!r.ok) throw new Error("o serviço respondeu "+r.status);
      const d = await r.json(); const a = d.address || {};
      p.rua = a.road || a.pedestrian || a.residential || a.footway || "";
      p.bairro = a.suburb || a.neighbourhood || a.quarter || a.city_district || "";
      p.cidade = a.city || a.town || a.municipality || a.village || "";
      if(!p.rua) p.rua = "(sem nome na base)";
      salvarLocal();
      setStatus("stNomes", "ok", "Nome das ruas: funcionando");
    }catch(e){
      setStatus("stNomes", "erro", "Nome das ruas falhou ("+(e.message||"sem conexão")+"). Os pontos continuam valendo.");
    }
    desenharPainel(); atualizarPopup(p);
    await new Promise(res => setTimeout(res, 1100));
  }
  filaRodando = false;
}

// ---------- ações sobre pontos ----------
function adicionarPonto(nome, lat, lng, referencia, tipo){
  garantirRota(nome);
  const p = {id:uid(), rota:nome, ordem:pontosDe(nome).length+1, lat, lng, tipo:tipo||"parada", referencia:referencia||"", rua:"", bairro:"", cidade:""};
  estado.pontos.push(p);
  salvarLocal(); calcularCaminho(nome); desenhar(); desenharPainel();
  pedirNome(p);
  return p;
}
function excluirPonto(id){
  const p = estado.pontos.find(x => x.id === id); if(!p) return;
  estado.pontos = estado.pontos.filter(x => x.id !== id);
  renumerar(p.rota); salvarLocal(); calcularCaminho(p.rota); desenhar(); desenharPainel();
}
function moverOrdem(id, delta){
  const p = estado.pontos.find(x => x.id === id); if(!p) return;
  const lista = pontosDe(p.rota); const i = lista.indexOf(p), j = i + delta;
  if(j < 0 || j >= lista.length) return;
  [lista[i].ordem, lista[j].ordem] = [lista[j].ordem, lista[i].ordem];
  salvarLocal(); calcularCaminho(p.rota); desenhar(); desenharPainel();
}
function alternarTipo(id){
  const p = estado.pontos.find(x => x.id === id); if(!p) return;
  p.tipo = p.tipo === "passagem" ? "parada" : "passagem";
  salvarLocal(); desenhar(); desenharPainel();
}

// ---------- desenho ----------
function conteudoPopup(p){
  const r = rota(p.rota); const n = numeroParada(p);
  const titulo = n ? "Parada "+n : "Ponto de passagem";
  const local = p.rua ? esc(p.rua) + (p.bairro ? " · " + esc(p.bairro) : "") + (p.cidade ? "<br>" + esc(p.cidade) : "") : "<small>Buscando o nome da rua…</small>";
  const ref = p.referencia ? "<br><i>" + esc(p.referencia) + "</i>" : "";
  const editar = p.rota === ativa
    ? `<button class="mini" data-acao="tipo" data-id="${p.id}">${p.tipo==="passagem"?"Virar parada":"Virar ponto de passagem"}</button><button class="mini perigo" data-acao="excluir" data-id="${p.id}">Excluir</button>`
    : `<button class="mini" data-acao="ativar" data-rota="${esc(p.rota)}">Editar ${esc(p.rota)}</button>`;
  const comp = compartilhadas[p.id] ? `<br><b style="font-size:.85rem">Parada compartilhada com: ${esc(compartilhadas[p.id].join(", "))}</b>` : "";
  return `<div class="pop"><b style="color:${r?r.cor:"#000"}">${esc(p.rota)}</b> · ${titulo}<br>${local}${ref}${comp}<br><small>${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}</small><div class="acoes">${editar}</div></div>`;
}
function atualizarPopup(p){ const m = marcadores[p.id]; if(m) m.setPopupContent(conteudoPopup(p)); }

let compartilhadas = {};
function calcularCompartilhadas(visiveis){
  compartilhadas = {};
  const paradas = estado.pontos.filter(p => p.tipo !== "passagem" && visiveis.has(p.rota));
  for(let i=0;i<paradas.length;i++) for(let j=i+1;j<paradas.length;j++){
    const a = paradas[i], b = paradas[j];
    if(a.rota === b.rota) continue;
    if(Math.abs(a.lat-b.lat) > 0.0005 || Math.abs(a.lng-b.lng) > 0.0005) continue;
    if(metros([a.lat,a.lng],[b.lat,b.lng]) <= 35){
      (compartilhadas[a.id] = compartilhadas[a.id] || []).includes(b.rota) || compartilhadas[a.id].push(b.rota);
      (compartilhadas[b.id] = compartilhadas[b.id] || []).includes(a.rota) || compartilhadas[b.id].push(a.rota);
    }
  }
}

function desenhar(){
  camadaSobrep.clearLayers(); camadaLinhas.clearLayers(); camadaPinos.clearLayers();
  for(const k in marcadores) delete marcadores[k];
  const visiveis = new Set(estado.rotas.filter(r => r.visivel).map(r => r.nome));

  // sobreposição de trechos
  const grade = new Map(); const amostras = {};
  visiveis.forEach(nome => {
    const g = geoms[nome]; if(!g || g.coords.length < 2) return;
    const am = amostrar(g.coords, 12); amostras[nome] = am;
    am.forEach(([lat,lng]) => { const [a,b] = celula(lat,lng); const k = a+":"+b; if(!grade.has(k)) grade.set(k,new Set()); grade.get(k).add(nome); });
  });
  for(const nome in amostras){
    let corrida = [], assin = null;
    const fechar = () => {
      if(corrida.length > 1 && assin){
        const nomes = assin.split("|");
        if(nomes[0] === nome){ // desenha uma vez só, pela primeira rota em ordem alfabética
          L.polyline(corrida, {color:getComputedStyle(document.documentElement).getPropertyValue("--sobrep").trim()||"#18222d", weight:15, opacity:.35, lineCap:"round"})
            .bindPopup("<b>Aqui passam "+nomes.length+" rotas:</b><br>"+nomes.map(esc).join(", ")).addTo(camadaSobrep);
        }
      }
      corrida = []; assin = null;
    };
    amostras[nome].forEach(pt => {
      const [a,b] = celula(pt[0], pt[1]); const s = new Set([nome]);
      for(let i=-1;i<=1;i++) for(let j=-1;j<=1;j++){ const c = grade.get((a+i)+":"+(b+j)); if(c) c.forEach(x => s.add(x)); }
      const sig = s.size > 1 ? [...s].sort().join("|") : null;
      if(sig !== assin){ const ultimo = corrida[corrida.length-1]; fechar(); if(sig && ultimo) corrida.push(ultimo); }
      assin = sig; if(sig) corrida.push(pt);
    });
    fechar();
  }

  // linhas das rotas
  estado.rotas.forEach(r => {
    if(!r.visivel) return;
    const g = geoms[r.nome]; if(!g) return;
    const det = (g.viaRuas ? "" : " · linha reta") + " · " + g.km.toFixed(1).replace(".",",") + " km";
    L.polyline(g.coords, {color:r.cor, weight: r.nome===ativa ? 6 : 4.5, opacity:.9, dashArray: g.viaRuas ? null : "8 8"})
      .bindPopup("<b>"+esc(r.nome)+"</b>"+det).addTo(camadaLinhas);
  });

  // pinos
  calcularCompartilhadas(visiveis);
  estado.rotas.forEach(r => {
    if(!r.visivel) return;
    pontosDe(r.nome).forEach(p => {
      const n = numeroParada(p);
      const html = n
        ? `<div class="pin${compartilhadas[p.id]?" comp":""}" style="background:${r.cor}"><span>${n}</span></div>`
        : `<div class="dot" style="background:${r.cor}"></div>`;
      const icone = L.divIcon({className:"", html, iconSize: n?[30,30]:[12,12], iconAnchor: n?[15,30]:[6,6], popupAnchor: n?[0,-28]:[0,-6]});
      const m = L.marker([p.lat,p.lng], {icon:icone, draggable: p.rota===ativa, zIndexOffset: p.rota===ativa?500:0})
        .bindPopup(conteudoPopup(p)).addTo(camadaPinos);
      m.on("dragend", ev => {
        const ll = ev.target.getLatLng(); p.lat = ll.lat; p.lng = ll.lng; p.rua = ""; p.bairro = ""; p.cidade = "";
        salvarLocal(); calcularCaminho(p.rota); desenhar(); desenharPainel(); pedirNome(p);
      });
      marcadores[p.id] = m;
    });
  });
}

// ---------- painel ----------
function desenharPainel(){
  const lr = document.getElementById("listaRotas");
  if(!estado.rotas.length){
    lr.innerHTML = '<p class="vazio">Nenhuma rota ainda. Carregue uma planilha ou crie uma rota pelo nome e toque no mapa para colocar os pontos.</p>';
  } else {
    lr.innerHTML = estado.rotas.map(r => {
      const pts = pontosDe(r.nome); const nPar = pts.filter(p => p.tipo !== "passagem").length;
      const g = geoms[r.nome];
      const km = g ? " · " + g.km.toFixed(1).replace(".",",") + " km" + (g.carregando ? " (calculando)" : g.viaRuas ? "" : " em linha reta") : "";
      return `<div class="rota${r.nome===ativa?" ativa":""}" tabindex="0" data-rota="${esc(r.nome)}">
        <span class="cor" style="background:${r.cor}"></span>
        <span class="nome">${esc(r.nome)}<span class="det">${nPar} parada${nPar===1?"":"s"}${km}</span></span>
        <button class="olho${r.visivel?"":" off"}" data-olho="${esc(r.nome)}" aria-label="${r.visivel?"Esconder":"Mostrar"} ${esc(r.nome)}" title="${r.visivel?"Esconder":"Mostrar"}">👁</button>
      </div>`;
    }).join("");
  }

  const bloco = document.getElementById("blocoAtiva");
  if(!ativa || !rota(ativa)){ bloco.innerHTML = ""; atualizarAvisoToque(); return; }
  const pts = pontosDe(ativa); const r = rota(ativa);
  bloco.innerHTML = `
    <h2>Editando ${esc(ativa)}</h2>
    <div class="linha">
      <input id="coord" placeholder="Cole a coordenada: -2.5593, -44.0559" aria-label="Coordenada" inputmode="text">
    </div>
    <div class="linha">
      <input id="ref" placeholder="Referência (opcional)" aria-label="Referência">
      <select id="tipo" aria-label="Tipo do ponto">
        <option value="parada"${tipoNovo==="parada"?" selected":""}>Parada</option>
        <option value="passagem"${tipoNovo==="passagem"?" selected":""}>Passagem</option>
      </select>
      <button id="addCoord" class="forte">Adicionar</button>
    </div>
    <div class="acoes" style="margin-bottom:8px">
      <button id="tocar" class="${modoTocar?"forte":""}">${modoTocar?"Parar de tocar no mapa":"Tocar no mapa para adicionar"}</button>
      <button id="nomesRota">Buscar nomes das ruas</button>
      <button id="recalcular">Recalcular caminho</button>
      <button id="excluirRota" class="perigo">Excluir rota</button>
    </div>
    <p id="msgCoord" class="vazio" aria-live="polite"></p>
    ${pts.length ? "" : '<p class="vazio">Sem pontos ainda. Cole uma coordenada acima ou ligue “Tocar no mapa”. Os pontos entram na ordem em que você coloca; o último é o destino.</p>'}
    <div>${pts.map((p,i) => {
      const n = numeroParada(p);
      const marca = n ? `<span class="n" style="background:${r.cor}">${n}</span>` : `<span class="n pass" style="background:${r.cor}"></span>`;
      const titulo = p.rua || p.referencia || (n ? "Parada "+n : "Ponto de passagem");
      const sub = [p.referencia && p.rua ? p.referencia : "", p.bairro, p.lat.toFixed(5)+", "+p.lng.toFixed(5)].filter(Boolean).join(" · ");
      return `<div class="ponto" tabindex="0" data-ir="${p.id}">${marca}
        <span class="txt">${esc(titulo)}<small>${esc(sub)}</small></span>
        <span class="bt">
          <button class="mini" data-subir="${p.id}" aria-label="Subir" ${i===0?"disabled":""}>↑</button>
          <button class="mini" data-descer="${p.id}" aria-label="Descer" ${i===pts.length-1?"disabled":""}>↓</button>
          <button class="mini perigo" data-excluir="${p.id}" aria-label="Excluir">✕</button>
        </span></div>`;
    }).join("")}</div>`;
  atualizarAvisoToque();
}

function atualizarAvisoToque(){
  const av = document.getElementById("avisoToque");
  const ligado = modoTocar && ativa;
  av.hidden = !ligado;
  if(ligado) av.textContent = "Toque no mapa para adicionar " + (tipoNovo==="passagem"?"ponto de passagem":"parada") + " à " + ativa;
  document.getElementById("mapa").classList.toggle("tocar", !!ligado);
}

function lerCoordenada(txt){
  const m = String(txt).trim().match(/(-?\d{1,3}(?:\.\d+)?)\s*[,;\s]\s*(-?\d{1,3}(?:\.\d+)?)/);
  if(!m) return null;
  const lat = parseFloat(m[1]), lng = parseFloat(m[2]);
  if(!(lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180)) return null;
  return [lat,lng];
}

// eventos do painel e dos popups (delegação)
document.addEventListener("click", e => {
  const t = e.target.closest("button,[data-rota],[data-ir]");
  if(!t) return;
  const d = t.dataset;
  if(d.olho){ e.stopPropagation(); const r = rota(d.olho); r.visivel = !r.visivel; salvarLocal(); desenhar(); desenharPainel(); return; }
  if(d.subir){ moverOrdem(d.subir,-1); return; }
  if(d.descer){ moverOrdem(d.descer,1); return; }
  if(d.excluir){ excluirPonto(d.excluir); return; }
  if(d.acao === "excluir"){ mapa.closePopup(); excluirPonto(d.id); return; }
  if(d.acao === "tipo"){ mapa.closePopup(); alternarTipo(d.id); return; }
  if(d.acao === "ativar"){ mapa.closePopup(); ativa = d.rota; desenhar(); desenharPainel(); return; }
  if(d.ir){ const p = estado.pontos.find(x => x.id === d.ir); if(p){ mapa.setView([p.lat,p.lng], 17); const m = marcadores[p.id]; if(m) m.openPopup(); } return; }
  if(t.classList.contains("rota") && d.rota){
    ativa = d.rota; const r = rota(ativa); if(!r.visivel) r.visivel = true;
    desenhar(); desenharPainel(); enquadrar([ativa]); return;
  }
  switch(t.id){
    case "addCoord": {
      const c = lerCoordenada(document.getElementById("coord").value);
      const msg = document.getElementById("msgCoord");
      if(!c){ msg.textContent = "Não entendi a coordenada. Use o formato do Google Maps: -2.5593, -44.0559"; return; }
      const ref = document.getElementById("ref").value.trim();
      const p = adicionarPonto(ativa, c[0], c[1], ref, document.getElementById("tipo").value);
      mapa.setView([p.lat,p.lng], Math.max(mapa.getZoom(), 15));
      setTimeout(() => { const el = document.getElementById("coord"); if(el) el.focus(); }, 50);
      break;
    }
    case "tocar": modoTocar = !modoTocar; desenharPainel(); break;
    case "nomesRota": pontosDe(ativa).forEach(p => pedirNome(p)); break;
    case "recalcular": delete geoms[ativa]; calcularCaminho(ativa); desenharPainel(); break;
    case "excluirRota":
      if(confirm("Excluir a rota "+ativa+" e todos os pontos dela?")){
        estado.pontos = estado.pontos.filter(p => p.rota !== ativa);
        estado.rotas = estado.rotas.filter(r => r.nome !== ativa);
        delete geoms[ativa]; ativa = estado.rotas[0] ? estado.rotas[0].nome : null;
        salvarLocal(); desenhar(); desenharPainel();
      }
      break;
  }
});
document.addEventListener("keydown", e => {
  if(e.key === "Enter" && e.target.id === "coord"){ document.getElementById("addCoord").click(); return; }
  if(e.key === "Enter" && (e.target.classList.contains("rota") || e.target.classList.contains("ponto"))) e.target.click();
});
document.addEventListener("change", e => { if(e.target.id === "tipo"){ tipoNovo = e.target.value; atualizarAvisoToque(); } });

document.getElementById("criarRota").addEventListener("click", () => {
  const inp = document.getElementById("novaRota"); const nome = inp.value.trim().toUpperCase();
  if(!nome) return;
  garantirRota(nome); ativa = nome; inp.value = ""; modoTocar = true;
  salvarLocal(); desenhar(); desenharPainel();
});
document.getElementById("novaRota").addEventListener("keydown", e => { if(e.key === "Enter") document.getElementById("criarRota").click(); });

function enquadrar(nomes){
  const pts = estado.pontos.filter(p => nomes.includes(p.rota));
  if(pts.length) mapa.fitBounds(L.latLngBounds(pts.map(p => [p.lat,p.lng])).pad(0.15));
}
document.getElementById("verTodas").addEventListener("click", () => enquadrar(estado.rotas.filter(r => r.visivel).map(r => r.nome)));

document.getElementById("recolher").addEventListener("click", e => {
  const aside = document.getElementById("painel"); const fechado = aside.classList.toggle("fechado");
  document.body.classList.toggle("painel-fechado", fechado);
  e.target.textContent = fechado ? "Abrir" : "Recolher"; e.target.setAttribute("aria-expanded", String(!fechado));
  setTimeout(() => mapa.invalidateSize(), 50);
});

document.getElementById("limparTudo").addEventListener("click", () => {
  if(!confirm("Apagar todas as rotas e pontos deste aparelho? Salve em Excel antes se quiser guardar.")) return;
  estado = {rotas:[], pontos:[]}; ativa = null; for(const k in geoms) delete geoms[k];
  salvarLocal(); desenhar(); desenharPainel();
});

// ---------- planilha: importar ----------
const semAcento = s => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
function numero(v){
  if(typeof v === "number") return v;
  const s = String(v||"").trim().replace(/\s/g,"");
  if(!s) return NaN;
  return parseFloat(/^-?\d+,\d+$/.test(s) ? s.replace(",",".") : s);
}
document.getElementById("arquivo").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = "";
  const msg = document.getElementById("msgImport");
  if(!f) return;
  if(typeof XLSX === "undefined"){ msg.textContent = "O leitor de planilhas não carregou. Confira a internet e abra a página de novo."; return; }
  try{
    const wb = XLSX.read(await f.arrayBuffer(), {type:"array"});
    const aba = wb.Sheets["Pontos"] || wb.Sheets[wb.SheetNames[0]];
    const linhas = XLSX.utils.sheet_to_json(aba, {defval:""});
    const lidas = [], semCoord = {};
    linhas.forEach((ln, idx) => {
      const o = {}; for(const k in ln) o[semAcento(k)] = ln[k];
      const nome = String(o.rota || "").trim().toUpperCase();
      if(!nome) return;
      const lat = numero(o.latitude ?? o.lat), lng = numero(o.longitude ?? o.lon ?? o.lng);
      if(!isFinite(lat) || !isFinite(lng)){ semCoord[nome] = (semCoord[nome]||0) + 1; return; }
      const ord = numero(o.ordem); const tipo = semAcento(o.tipo||"").startsWith("pass") ? "passagem" : "parada";
      lidas.push({nome, lat, lng, ordem: isFinite(ord) ? ord : 1e6 + idx, tipo,
        referencia: String(o.referencia || o.endereco || "").trim(),
        rua: String(o.rua||"").trim(), bairro: String(o.bairro||"").trim(), cidade: String(o.cidade||"").trim()});
    });
    if(!lidas.length){ msg.textContent = "Nenhum ponto com rota, latitude e longitude foi encontrado. Confira se a planilha segue o modelo (colunas rota, ordem, latitude, longitude)."; return; }
    const nomes = [...new Set(lidas.map(l => l.nome))];
    estado.pontos = estado.pontos.filter(p => !nomes.includes(p.rota));
    nomes.forEach(n => { garantirRota(n); delete geoms[n]; });
    lidas.sort((a,b) => a.ordem - b.ordem).forEach(l => {
      estado.pontos.push({id:uid(), rota:l.nome, ordem:0, lat:l.lat, lng:l.lng, tipo:l.tipo, referencia:l.referencia, rua:l.rua, bairro:l.bairro, cidade:l.cidade});
    });
    nomes.forEach(renumerar);
    ativa = nomes[0];
    salvarLocal(); calcularTodas(); desenhar(); desenharPainel(); enquadrar(nomes);
    const faltas = Object.entries(semCoord).map(([n,q]) => n+": "+q).join(", ");
    msg.textContent = "Carregado: " + nomes.length + " rota(s), " + lidas.length + " ponto(s)." +
      (faltas ? " Linhas sem latitude/longitude ficaram de fora (" + faltas + ")." : "") +
      " Rotas com o mesmo nome que já existiam foram substituídas.";
  }catch(err){
    msg.textContent = "Não consegui ler esse arquivo. Salve como .xlsx ou .csv e tente de novo.";
  }
});

// ---------- planilha: salvar ----------
document.getElementById("salvarExcel").addEventListener("click", () => {
  if(typeof XLSX === "undefined"){ alert("O gerador de planilhas não carregou. Confira a internet."); return; }
  if(!estado.pontos.length){ alert("Ainda não há pontos para salvar."); return; }
  const linhas = [];
  estado.rotas.forEach(r => pontosDe(r.nome).forEach(p => linhas.push({
    rota:p.rota, ordem:p.ordem, tipo:p.tipo, latitude:p.lat, longitude:p.lng,
    referencia:p.referencia, rua:p.rua, bairro:p.bairro, cidade:p.cidade
  })));
  const resumo = estado.rotas.map(r => { const g = geoms[r.nome]; const pts = pontosDe(r.nome);
    return {rota:r.nome, paradas:pts.filter(p => p.tipo!=="passagem").length, pontos_de_passagem:pts.filter(p => p.tipo==="passagem").length,
      km: g ? Math.round(g.km*10)/10 : "", caminho: g ? (g.viaRuas ? "pelas ruas" : "linha reta") : ""}; });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(linhas), "Pontos");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(resumo), "Resumo");
  XLSX.writeFile(wb, "rotas_" + new Date().toISOString().slice(0,10) + ".xlsx");
});

// ---------- início ----------
desenharPainel(); calcularTodas(); desenhar();
if(estado.pontos.length) enquadrar(estado.rotas.map(r => r.nome));
</script>
